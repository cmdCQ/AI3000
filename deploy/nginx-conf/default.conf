# AI三千问 - Nginx 配置（安全加固版）

upstream backend {
    server backend:3301;
}
upstream rag {
    server rag:8800;
}
upstream upload {
    server upload:3401;
}

# 限流区域
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sms_limit:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=scan_req:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=scan_conn:10m;
server_tokens off;

# HTTP → HTTPS（所有域名统一跳转）
server {
    listen 80;
    server_name sqw.somtfly.com gh.somtfly.com know.somtfly.com;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# sqw.somtfly.com — AI三千问
# ============================================================
server {
    listen 443 ssl http2 proxy_protocol;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.18.0.0/16;
    real_ip_header proxy_protocol;
    real_ip_recursive on;
    server_name sqw.somtfly.com;

    ssl_certificate     /host_letsencrypt/live/somtfly.com/fullchain.pem;
    ssl_certificate_key /host_letsencrypt/live/somtfly.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    # 拒绝敏感路径
    # 教训：按文件名枚举的黑名单一定会漏。nginx-stage1.conf 和
    # nginx-default.conf.live-103 就是这样被公网下载的（200 + 8972/11490 字节
    # application/octet-stream，内容含 upstream、各 vhost 域名、proxy_pass
    # 内网地址、证书路径）。根因是 nginx 配置放在 webroot 里 —— 已结构性修掉：
    # 配置文件现在在 /var/www/sqw.somtfly.com/deploy/，webroot 只放前端资产。
    # 以下规则是第二道防线。
    location ~ /\.(git|env|svn|hg|DS_Store|htaccess|htpasswd|npmrc|dockerenv) { deny all; return 404; }
    location ~* \.(conf|config|cnf|ini|ya?ml|toml|env|sh|bash|zsh|py|pl|rb|go|rs|java|class|jar|sql|dump|sqlite|db|bak|old|orig|save|copy|tmp|temp|rej|swp|swo|log|md|markdown|lock|pem|key|pub|crt|cer|csr|p12|pfx|jks|keystore|dist|map)$ { deny all; return 404; }
    location ~* \.(bak|old|orig|save|copy|tmp|temp|rej|swp|swo|live|stage|staging|pre|prod|dev|new|latest)[-_.][0-9A-Za-z][0-9A-Za-z._-]*$ { deny all; return 404; }

    # API 代理
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 临时文件中转服务
    location /api/up/ {
        proxy_pass http://upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 210m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    # 短信发送限流
    location /api/send-sms-code {
        limit_req zone=sms_limit burst=3 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 登录限流
    location /api/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 多页站点，无客户端路由：不存在的路径就该是 404
    # （原为 $uri $uri/ /index.html，把每个 404 伪装成 200 首页 → 死链永远发现不了）
    location / {
        try_files $uri $uri/ =404;
    }
}


