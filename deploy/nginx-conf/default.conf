# dsh.somtfly.com — DeepSeek Harness Web UI (dsh web, 2026-10-14 柒柒)
# ============================================================
server {
    listen 443 ssl http2 proxy_protocol;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.18.0.0/16;
    real_ip_header proxy_protocol;
    real_ip_recursive on;
    server_name dsh.somtfly.com;

    ssl_certificate     /host_letsencrypt/live/dsh.somtfly.com/fullchain.pem;
    ssl_certificate_key /host_letsencrypt/live/dsh.somtfly.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 200m;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    # ---- billion-context 压缩代理面板：同源反代（2026-10-16） ----
    # bili 的管理端点 /__bili/ 只认本机 origin，而插件把面板 origin 报成
    # http://127.0.0.1:18787，远程浏览器访问不到。这里把 origin 改写成本站同源，
    # 再由下面的 location 经宿主机 socat 桥（dsh-bili-bridge.service）回到代理。
    # 管理端点走 basic auth（/etc/dsh-bili/htpasswd），不对外裸奔。
    location = /bili/origin {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"origin":"https://dsh.somtfly.com"}';
    }

    location ^~ /__bili {
        auth_basic           "billion-context";
        auth_basic_user_file /etc/nginx/dsh-bili/htpasswd;

        proxy_pass http://172.18.0.1:18787;
        proxy_http_version 1.1;
        # bili 管理端点校验 Host / Origin 必须是本机 origin，这里替远程浏览器满足它
        proxy_set_header Host              127.0.0.1:18787;
        proxy_set_header Origin            http://127.0.0.1:18787;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header X-Real-IP         127.0.0.1;
        proxy_set_header X-Forwarded-For   127.0.0.1;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header Server;
    }

    location / {
        proxy_pass http://172.18.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_hide_header Server;
    }
}
