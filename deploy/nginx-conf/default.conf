# AI三千问 - Nginx 配置（安全加固版）

upstream backend {
    server backend:3301;
}
upstream rag {
    server rag:8800;
}
upstream upload {
    server upload:3401;
}

# 限流区域
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sms_limit:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=scan_req:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=scan_conn:10m;
server_tokens off;

# ── 压缩 ──────────────────────────────────────────────────────────────
# 2026-10-16: 原先这几行写在 `server sqw.somtfly.com` 块里，于是**只有 sqw 被压缩**，
# gh / scan / know / somt.top / freep.somt.top 全都原样发原始字节（实测 gh 9354B 未压，
# 而且没有 content-encoding 头）。移到 http 作用域，所有 vhost 一起受益。
gzip on;
gzip_min_length 256;
# ⚠️ 这份类型清单是**白名单**，永远不要写成 `gzip_types *` 或 `text/event-stream`。
# `/api/chat/send` 和八字解读线是 SSE（`Content-Type: text/event-stream`，
# 后端逐 token `res.write`），前端用 `xhr.onprogress` 增量读。一旦把 text/event-stream
# 也压了，流式就变成「等半天来一大坨」，AI 对话直接坏掉。白名单天然把它排除在外。
gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/manifest+json
    text/xml
    application/xml
    image/svg+xml;
# 默认 comp_level=1，压得很保守。实测 6 比 1 再省 6%~15%
# （hexagrams_data.js：线上 123608B → gzip -6 的 105169B）。本站流量很小，CPU 无感。
gzip_comp_level 6;
# 让 CDN/代理按 Accept-Encoding 分开缓存，避免把 gzip 响应发给不支持的客户端。
gzip_vary on;
# 本站全部流量都经过 frp 中继进来（带 X-Forwarded-For），对上游代理的响应也要压。
# 之所以安全，是因为压缩只作用于上面的白名单类型，不碰 text/event-stream。
gzip_proxied any;

# HTTP → HTTPS（所有域名统一跳转）
server {
    listen 80;
    server_name sqw.somtfly.com gh.somtfly.com know.somtfly.com;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# sqw.somtfly.com — AI三千问
# ============================================================
server {
    listen 443 ssl http2 proxy_protocol;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.18.0.0/16;
    real_ip_header proxy_protocol;
    real_ip_recursive on;
    server_name sqw.somtfly.com;

    ssl_certificate     /host_letsencrypt/live/somtfly.com/fullchain.pem;
    ssl_certificate_key /host_letsencrypt/live/somtfly.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    # 拒绝敏感路径
    # 教训：按文件名枚举的黑名单一定会漏。nginx-stage1.conf 和
    # nginx-default.conf.live-103 就是这样被公网下载的（200 + 8972/11490 字节
    # application/octet-stream，内容含 upstream、各 vhost 域名、proxy_pass
    # 内网地址、证书路径）。根因是 nginx 配置放在 webroot 里 —— 已结构性修掉：
    # 配置文件现在在 /var/www/sqw.somtfly.com/deploy/，webroot 只放前端资产。
    # 以下规则是第二道防线。
    location ~ /\.(git|env|svn|hg|DS_Store|htaccess|htpasswd|npmrc|dockerenv) { deny all; return 404; }
    location ~* \.(conf|config|cnf|ini|ya?ml|toml|env|sh|bash|zsh|py|pl|rb|go|rs|java|class|jar|sql|dump|sqlite|db|bak|old|orig|save|copy|tmp|temp|rej|swp|swo|log|md|markdown|lock|pem|key|pub|crt|cer|csr|p12|pfx|jks|keystore|dist|map)$ { deny all; return 404; }
    location ~* \.(bak|old|orig|save|copy|tmp|temp|rej|swp|swo|live|stage|staging|pre|prod|dev|new|latest)[-_.][0-9A-Za-z][0-9A-Za-z._-]*$ { deny all; return 404; }

    # ── 静态资源长缓存 ────────────────────────────────────────────────
    # 前提由 deploy/sync.sh 保证：它在生成 build/nginx 时会给每个静态资源引用
    # 打上 `?v=<内容哈希前8位>`（deploy/version-assets.py）。URL 跟着内容走，
    # 所以这里可以放心用 expires max（Cache-Control: max-age=315360000）。
    # 之前是全站没有任何 Cache-Control，只有 ETag/Last-Modified：每次翻页都要对
    # 每个 css/js 各发一次条件请求，经过香港中继就是一次次白跑的往返。
    #
    # 为什么用 `expires` 而不是 `add_header Cache-Control`：
    # 本 server 块在 server 层声明了 6 条安全头（HSTS/CSP/X-Frame-Options/...），
    # 而 nginx 的 add_header **一旦在更内层出现，就会顶掉继承来的全部 add_header**。
    # 在 location 里写 add_header Cache-Control 会让这些资源响应丢掉安全头。
    # `expires` 不参与那套继承规则，没有这个陷阱。
    #
    # 只认 /css/ /js/ /assets/ 三个目录：不碰 /api/（反代响应绝不能被长缓存）。
    # 位置必须在上面三条 deny 规则**之后** —— nginx 用第一个匹配的正则 location。
    location ~* ^/(css|js|assets)/.*\.(css|js|mjs|svg|png|jpe?g|webp|gif|ico|avif|woff2?|ttf|otf|eot|mp3|mp4|webm|lrc|json|webmanifest)$ {
        expires max;
    }

    # API 代理
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 临时文件中转服务
    location /api/up/ {
        proxy_pass http://upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 210m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    # 短信发送限流
    location /api/send-sms-code {
        limit_req zone=sms_limit burst=3 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 登录限流
    location /api/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 多页站点，无客户端路由：不存在的路径就该是 404
    # （原为 $uri $uri/ /index.html，把每个 404 伪装成 200 首页 → 死链永远发现不了）
    location / {
        # HTML 必须每次回源验证：页面一变用户就该看到新的。
        # 条件请求拿到 304 很便宜，而且这才是「页面立刻生效」的代价。
        # 静态资源不在这里 —— 它们由上面的 /css|js|assets/ 规则长缓存。
        expires -1;
        try_files $uri $uri/ =404;
    }
}


