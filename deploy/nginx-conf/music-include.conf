# music.somtfly.com 的代理不属于 AI3000 仓库（那是另一个项目 EBNR），
# 它的 server 块在宿主机 /var/www/music.somtfly.com/nginx/music.conf，
# 由 docker-compose 以**目录**形式挂到 /etc/nginx/music-conf，
# 这里只做一次 include（nginx 的 conf.d/*.conf 不会递归进子目录）。
#
# 为什么保留这一行而不是把配置整个搬走：nginx 容器得知道去哪儿找外部配置。
# 这一行不带任何域名、证书路径或后端地址 —— 那些都在宿主机那份文件里。
#
# 挂目录而不是挂单个文件：单文件挂载在宿主机替换文件（换 inode）后容器里
# 仍是旧内容，改配置不生效又看不出来（2026-10-16 因此挂过一次线上 HTTPS）。
include /etc/nginx/music-conf/*.conf;
