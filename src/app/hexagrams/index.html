<!-- 老页 `src/web/hexagrams/index.html` 第 9-10 行那两条 CSS 顺序搬进了
     `./style.css` 的 `@import`（page-hexagrams.css → tokens.css），这里不再有 <link>。 -->

<!-- 本页只剩**一条**传统 script，就是下面这条 hexagrams_data.js：
       · 64 卦的**纯数据**（`var HEXAGRAM_DATA = {...}`，309KB），没有任何函数。
       · 它同时被 mhys_ai_panel 与 liuyao 的卦象渲染共用，属阶段 4
         一次性 cut-over 的共享层（见计划文档 §4.18 的规模表：数据 blob 占共享层
         总量 88%，风险近零）。搬过来的时机是「共享层 cut-over」，不是现在 ——
         现在改成 `import HEXAGRAM_DATA from ...` 会让 src/web 里另外两个老页
         拿不到这个全局，中间态出现两套机制，正是 §4.18 禁止的。

     ★ 执行顺序：`vite build` 会把 `<script type="module">` 搬进 `<head>`，文档
       顺序上排在 hexagrams_data.js 之前；但 module 自带 defer，要等 HTML 解析完
       （hexagrams_data.js 已跑完）才执行。所以真实顺序仍是 data → main.jsx，
       与老页 `:35-36` 一致。 -->
<script src="/js/hexagrams_data.js"></script>
<script type="module" src="./main.jsx"></script>
</body>
