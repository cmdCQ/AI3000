     ★ 执行顺序为什么仍然对（**这是 Vite 的实际行为，别按源码里的位置想**）：
       `vite build` 会把 `<script type="module">` 连同 CSS link **搬进 `<head>`**，
       所以产物里 module 标签在文档顺序上**排在这六条之前**。但 `type="module"`
       自带 defer 语义：它要等 HTML 解析完（也就是六条 classic script 全跑完）
       才执行。于是真实顺序是
           六条传统 script（依赖） → main.jsx（使用者） → DOMContentLoaded
       而 main.jsx 里用 `flushSync` 同步提交 React 外壳，所以 AI 面板引擎在
       DOMContentLoaded 分支里已经能拿到 `#resultArea`。
       ⚠ 反过来说：**不能**因为「module 被搬到前面了」就以为页面会在 classic
       script 之前跑 —— 那样 `renderLiuyaoResult` / `Solar` / `AI_PANEL_CONF` 全都
       还不存在。defer 是这个顺序唯一的保障。
     阶段 4 收口时它们整体搬进 src/app/，这几个 script 标签一起去掉。 -->
