<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 对话 · 易三千</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
</head>
<body>
<div id="root"></div>

<!-- 下面这两个是**传统 script**，不能改成 module、也不能删：

     · auth.js  提供 window.openAuthModal（登录门禁）与 window.handleApiUnauthorized
                （流式收尾时的 401 分支）。阶段 4 它整个搬进 src/app/ 后这两个
                script 标签一起去掉；在那之前由 src/app/lib/auth.js 里的薄封装转调。

     · visual-polish.js  等待态的计时与阶段文案。它 boot() 时会读 #msgsArea，
                读不到就**静默放弃**（不报错）。所以 main.jsx 里用 flushSync
                把 React 的首次提交做成同步的，保证 DOMContentLoaded 时
                #msgsArea 已经在了。它还调 window.showErrorToast，由 main.jsx 挂。

     两者都在 module 之前：传统 script 会立刻执行，module 是 defer 的，
     等解析完才跑。visual-polish 只在装载时注册 DOMContentLoaded，不调页面
     任何函数，所以放在 module 前面没有副作用。 -->
<script src="/js/auth.js"></script>
<script type="module" src="./main.jsx"></script>
</body>
</html>
