<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>排盘记录 · 六爻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<link rel="stylesheet" href="/css/shared-history.css">
<link rel="stylesheet" href="/css/tokens.css">
</head>
<body>

<!-- 悬浮菜单 -->
<div class="float-menu" id="floatMenu">
  <div class="fm-top">
    <div class="fm-left">
      <a href="/liuyao/" class="fm-back">← 返回</a>
      <span class="fm-title">排盘记录</span>
    </div>
    <div class="fm-right">
      <button class="fm-btn manage-btn" id="manageBtn" onclick="toggleManage()">管理</button>
    </div>
  </div>
  <div class="fm-search">
    <input type="text" id="searchInput" placeholder="搜索卦例..." oninput="onSearch()">
    <button class="fm-search-clear" id="searchClear" onclick="clearSearch()">✕</button>
  </div>
  <div class="fm-actions" id="fmActions">
    <span class="fm-select-all" onclick="toggleSelectAll()">全选</span>
    <span style="font-size:0.72rem;color:var(--text-dim)" id="selectedCount">已选 0</span>
    <button class="fm-delete-selected" id="deleteSelectedBtn" onclick="deleteSelected()" disabled>删除选中</button>
  </div>
</div>

<div class="mh-wrapper">
  <div id="contentArea">
    <div class="load-state">
      <div class="spinner"></div>
      <p>加载中...</p>
    </div>
  </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/page-liuyao-history.js"></script>
</body>
</html>
