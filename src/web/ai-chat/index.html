<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 对话 · 易三千</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<link rel="stylesheet" href="/css/page-ai-chat.css">
</head>
<body>
<div class="chat-app">

  <!-- Top Bar -->
  <div class="chat-topbar">
    <button class="back-btn" id="backBtn" onclick="handleBack()">←</button>
    <span class="title">AI 对话</span>
    <button class="clear-btn" id="clearBtn" onclick="clearHistory()">清空</button>
  </div>

  <!-- Messages -->
  <div class="msgs-area" id="msgsArea">
    <div class="msgs-empty" id="emptyState">
      <div class="empty-icon">💬</div>
      <div class="empty-title">开始对话</div>
      <div class="empty-desc">可以直接提问命理问题<br>或点击下方「分享排盘」发送排盘记录</div>
    </div>
  </div>

	<!-- Pending Card Preview -->
	<div class="pending-card-bar" id="pendingCardBar" style="display:none">
	  <div class="pcard-content" id="pendingCardContent"></div>
	  <button class="pcard-remove" onclick="clearPendingCard()">✕</button>
	</div>

  <!-- Input Area -->
  <div class="input-area">
    <div class="input-share-bar">
      <button class="input-share-btn" onclick="openSharePicker()"><span class="share-icon">📤</span> 分享排盘</button>
    </div>
    <div class="input-row">
      <textarea id="chatInput" rows="1" placeholder="输入消息…" maxlength="2000" onkeydown="onInputKeydown(event)" oninput="autoResizeInput(this)"></textarea>
      <button class="input-stop-btn" id="stopBtn" onclick="stopStream()" title="中断输出">■</button>
      <button class="input-send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>

</div>

<!-- Share Picker Overlay -->
<div class="picker-overlay" id="pickerOverlay" onclick="closeSharePicker()"></div>
<div class="picker-panel" id="pickerPanel">
  <div class="picker-hdr">
    <span>📤 分享到对话</span>
    <button class="picker-close" onclick="closeSharePicker()">✕</button>
  </div>
  <div class="picker-tabs">
    <button class="picker-tab active" data-type="mhys" onclick="switchPickerTab('mhys')">🌸 梅花易数</button>
    <button class="picker-tab" data-type="liuyao" onclick="switchPickerTab('liuyao')">🪙 六爻</button>
  </div>
  <div class="picker-body" id="pickerBody">
    <div class="picker-loading"><div class="pk-spinner"></div><div>加载中…</div></div>
  </div>
</div>



<link rel="stylesheet" href="/css/tokens.css">
<script src="/js/auth.js"></script>
<script src="/js/page-ai-chat.js"></script>
<script src="/js/visual-polish.js"></script>
</body>
</html>
