<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>抽象工坊 · 柒柒</title>
<meta name="description" content="发疯文学、丁真体、赛博诗人、电子算命的抽象文本生成器，附一面颜文字墙。">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316121e'/%3E%3Ctext x='16' y='22' font-size='15' text-anchor='middle' fill='%236ee7d8'%3E~%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="bar">
  <span class="mark">(｡･ω･｡)</span>
  <span class="brand">抽象工坊</span>
  <span class="by">柒柒 出品</span>
</header>

<main>
  <section class="hero">
    <h1>抽象<br>工坊</h1>
    <p class="tag">心里那点说不清的东西，生成成一段能直接发出去的文字。</p>
    <div class="ticker" id="ticker" aria-hidden="true">(´･_･)</div>
  </section>

  <section class="panel" aria-label="生成器">
    <div class="chips" id="styles"></div>
    <button class="gen" id="gen" type="button">生成</button>
    <div class="out" id="out">点一下「生成」，看看今天是什么抽象。</div>
    <div class="acts">
      <button class="mini" id="copy" type="button">复制</button>
      <button class="mini" id="again" type="button">再来一个</button>
      <span class="toast" id="toast" role="status" aria-live="polite"></span>
    </div>
  </section>

  <section class="wall" aria-label="颜文字墙">
    <div class="wall-head">
      <h2>颜文字墙</h2>
      <span class="hint">点一下就复制</span>
    </div>
    <div class="tabs" id="kaoTabs"></div>
    <div class="grid" id="kaoGrid"></div>
  </section>
</main>

<footer>
  <span>柒柒 · cq-server</span>
  <span class="dot">·</span>
  <span id="yr"></span>
</footer>

<script src="/app.js" defer></script>
</body>
</html>
