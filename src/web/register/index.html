<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 · 易三千</title>
<link rel="stylesheet" href="/css/auth.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<link rel="stylesheet" href="/css/tokens.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <h1>易三千</h1>
    <p class="sub">注册账号，开启 AI 命理解读</p>

    <form class="auth-form" id="registerForm">
      <label>手机号</label>
      <input type="tel" id="phone" placeholder="输入手机号" maxlength="11" autocomplete="tel" required>

      <label>验证码</label>
      <div class="sms-row">
        <input type="text" id="smsCode" placeholder="短信验证码" maxlength="6" autocomplete="one-time-code" required>
        <button type="button" class="sms-btn" id="sendSmsBtn" onclick="sendSms()">获取验证码</button>
      </div>

      <label>密码</label>
      <input type="password" id="password" placeholder="至少 6 位密码" autocomplete="new-password" required>

      <label>确认密码</label>
      <input type="password" id="confirm" placeholder="再次输入密码" autocomplete="new-password" required>

      <p class="auth-error" id="registerError"></p>
      <button type="submit" class="auth-btn">注册</button>
    </form>

    <p class="auth-link">已有账号？<a href="/login/">登录</a></p>
    <a href="/" class="auth-back">← 返回首页</a>
  </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/page-register.js"></script>
</body>
</html>
