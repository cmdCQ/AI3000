<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>易三千</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/home.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
</head>
<body>

<div class="home-wrapper">

  <header class="home-header">
    <div class="home-emblem">🏮</div>
    <h1 class="home-title">易三千</h1>
    <p class="home-sub">问天 · 问命 · 问心</p>
    <div class="home-rule"></div>
  </header>

  <!-- AI 对话入口 -->
  <div class="ai-chat-entrance" onclick="openChatOverlay()">
    <span class="ai-ent-icon">💬</span>
    <span class="ai-ent-text">AI 对话</span>
    <span class="ai-ent-arrow">›</span>
  </div>

  <!-- 全屏 AI 对话弹窗 -->
  <div class="chat-overlay" id="chatOverlay">
    <div class="chat-overlay-inner">
      <iframe class="chat-overlay-iframe" id="chatIframe" src="/ai-chat/" frameborder="0"></iframe>
    </div>
  </div>

  <!-- 公告弹窗 -->
  <div class="announcement-overlay" id="announcementOverlay">
    <div class="announcement-modal">
      <div class="announcement-modal-header">
        <span class="announcement-modal-title">📢 公告</span>
        <button class="announcement-modal-close" onclick="closeAnnouncement()">✕</button>
      </div>
      <div class="announcement-modal-body markdown-body" id="announcementModalBody">
        加载中...
      </div>
    </div>
  </div>

  <!-- Tab 1: 命理与术数 -->
  <div id="tab-modules" class="tab-content">
    <!-- 流动公告栏 -->
    <div class="announcement-bar" id="announcementBar" onclick="openAnnouncement()">
      <span class="announcement-icon">📢</span>
      <div class="announcement-marquee">
        <span class="announcement-track" id="announcementTrack">欢迎来到易三千 · AI 命理解读平台已正式上线，八字排盘、梅花易数、六爻起卦，DeepSeek 智能解卦，点击查看详情</span>
      </div>
      <span class="announcement-arrow">›</span>
    </div>

    <!-- 建议入口 -->
    <div style="text-align:center;margin:1.5rem 0 0.5rem;">
      <a href="#" onclick="return handleSuggestionClick()" style="
        display:inline-block;
        font-size:0.78rem;
        color:var(--accent-dim);
        text-decoration:none;
        padding:0.45rem 1.2rem;
        border:1px dashed var(--border);
        border-radius:20px;
        letter-spacing:0.04em;
        transition:all 0.2s ease;
        cursor:pointer;
      " onmouseover="this.style.borderColor='var(--border-active)';this.style.color='var(--accent)'"
         onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--accent-dim)'">
        💬 我们需要你宝贵的建议
      </a>
    </div>

    <section class="home-section">
      <div class="section-head">
        <span class="cat">命理</span>
        <span>命运推演 · 知命而行</span>
      </div>
      <div class="module-list">
        <!-- 八字（四柱）：这条路本来是通的 —— `handleModuleClick('charts')` 走到
             `/select-chart/?type=charts` → 新建命盘 → 命盘详情，全程既有代码，
             只是**首页没有一张卡调它**，于是用户根本进不去；而公告栏里还写着
             「八字排盘…已正式上线」。补上这张卡，落点沿用既有参数 `charts`
             （`select-chart` 里就把它标成「📜 四柱八字」），不新造路由。
             描述只写现在真有的东西：十神/大运/神煞/AI 解读都还没做，
             不能在卡片上先把话说出去。 -->
        <div class="module-card active" onclick="handleModuleClick('charts')">
          <span class="icon">📜</span>
          <span class="body"><span class="name">四柱八字</span><span class="desc">四柱干支 · 农历生肖 · 真太阳时</span></span>
        </div>
      </div>
    </section>
    <section class="home-section">
      <div class="section-head">
        <span class="cat">术数</span>
        <span>即时占卜 · 问事而决</span>
      </div>
      <div class="module-list">
        <div class="module-card active" onclick="window.location.href='/hexagrams/'">
          <span class="icon">📖</span>
          <span class="body"><span class="name">六十四卦</span><span class="desc">卦辞 · 爻辞 · 象传 · 详解</span></span>
        </div>
        <div class="module-card active" onclick="handleModuleClick('meihua')">
          <span class="icon">🌸</span>
          <span class="body"><span class="name">梅花易数</span><span class="desc">年月日时 · 万物类象</span></span>
        </div>
        <div class="module-card active" onclick="handleModuleClick('liuyao')">
          <span class="icon">🪙</span>
          <span class="body"><span class="name">六爻</span><span class="desc">铜钱起卦 · 六十四卦</span></span>
        </div>
      </div>
    </section>
    <footer class="home-footer">
      <div>易三千 · 2026</div>
      <div class="home-footer-credit">Created by <a href="https://github.com/cmdCQ/" target="_blank">CQ / 参群</a></div>
      <div class="uptime-line">
        <span>已稳定运行</span>
        <span class="uptime-timer" id="uptimeTimer">--</span>
      </div>
    </footer>
  </div>

  <!-- Tab 2: 我的命盘 — 已迁至独立页面 /my-charts/ -->
  <div id="tab-charts" class="tab-content" style="display:none"></div>

  <!-- Tab 3: 我的 -->
  <div id="tab-profile" class="tab-content" style="display:none">
    <div id="tab-profile-content"></div>
  </div>

</div>

<!-- 底部悬浮导航栏 -->
<nav class="bottom-nav" id="bottomNav">
  <button class="nav-item active" data-tab="modules">
    <span class="nav-label">命理与术数</span>
  </button>
  <button class="nav-item" onclick="location.href='/my-charts/'" style="cursor:pointer">
    <span class="nav-label">我的命盘</span>
  </button>
  <button class="nav-item" onclick="location.href='/my/'" style="cursor:pointer">
    <span class="nav-label">我的</span>
  </button>
</nav>

<script src="/js/charts-store.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/page-home.js"></script>
</body>
</html>
