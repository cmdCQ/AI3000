services:
  mysql:
    image: mysql:8.0
    container_name: ai3000-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ai3000
      MYSQL_USER: ai3000
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ai3000_mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - ai3000_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag:
    image: docker-rag:latest
    container_name: ai3000-rag
    restart: unless-stopped
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
      RAG_EMBEDDING_MODE: local
      # fastembed 默认把模型缓存到容器内的 /tmp/fastembed_cache（可写层），容器一重建就没了，
      # 而本模型在 fastembed 注册表里没有 hf 源、唯一的 GCS 源已 403，下载不回来 → 检索全 500。
      # 钉到 /app/model_cache 并挂卷持久化。卷内容由 deploy/fetch-embedding-model.sh 生成。
      FASTEMBED_CACHE_PATH: /app/model_cache
    volumes:
      - ai3000_rag_vector_db:/app/vector_db
      - ai3000_model_cache:/app/model_cache
    networks:
      - ai3000_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8800/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    image: docker-backend:latest
    container_name: ai3000-backend
    restart: unless-stopped
    command: pm2-runtime start auth-server.js --name ai3000-auth
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_USER: ai3000
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ai3000
      RAG_URL: http://rag:8800
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALIBABA_ACCESS_KEY_ID: ${ALIBABA_ACCESS_KEY_ID}
      ALIBABA_ACCESS_KEY_SECRET: ${ALIBABA_ACCESS_KEY_SECRET}
      ALIBABA_SIGN_NAME: 速通互联验证码
      ALIBABA_TEMPLATE_CODE: "100001"
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET}
    volumes:
      - /var/www/sqw.somtfly.com/data:/data:rw
      - /var/www/sqw.somtfly.com/build/backend/auth-server.js:/app/auth-server.js:ro
      - /var/www/sqw.somtfly.com/build/backend/config.js:/app/config.js:ro
      - /var/www/sqw.somtfly.com/build/backend/chat-proxy.js:/app/chat-proxy.js:ro
      # AI 对话的工具层。**不加这一行，backend 会起不来**（auth-server 顶部
      # `require('./chat-tools.js')` 直接 MODULE_NOT_FOUND），而它是单文件挂载，
      # rsync 把文件放进 build/backend 并不会让它出现在容器里。
      - /var/www/sqw.somtfly.com/build/backend/chat-tools.js:/app/chat-tools.js:ro
      # 排盘/装卦模块（六爻纳甲、八宫世应、旬空、旺衰、伏神、卦身）。只读挂载；
      # 改这里要 `docker compose up -d backend` 重建容器（backend 无热重载）
      - /var/www/sqw.somtfly.com/build/backend/paipan:/app/paipan:ro
    networks:
      - ai3000_net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3301/api/me',r=>{process.exit(r.statusCode===200||r.statusCode===401?0:1)})"]
      interval: 15s
      timeout: 5s
      retries: 5

  upload:
    image: docker-upload:latest
    container_name: ai3000-upload
    restart: unless-stopped
    environment:
      UPLOAD_TOKEN: ${UPLOAD_TOKEN}
      UPLOAD_ADMIN_PW: ${UPLOAD_ADMIN_PW}
    volumes:
      - ai3000_upload_data:/data
    networks:
      - ai3000_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3401/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 20s
      timeout: 5s
      retries: 3

  nginx:
    image: docker-nginx:latest
    container_name: ai3000-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ai3000_nginx_certs:/etc/letsencrypt
      - /etc/letsencrypt:/host_letsencrypt:ro
      - /var/www/sqw.somtfly.com/build/nginx:/usr/share/nginx/html:ro
      # 配置改为宿主机挂载（2026-10-16）：改完只要 `docker exec ai3000-nginx nginx -s reload`，
      # 不再依赖 docker cp（容器一重建就丢，且镜像里烤进去的是带 cheak 拼写错误的旧版）。
      # 整目录挂载（2026-10-16）：原来挂单个文件，宿主机一替换文件（编辑器/sed -i
      # 都会换 inode），容器里看到的还是旧 inode，改配置不生效又看不出来 —— 这个坑
      # 导致过一次线上 HTTPS 全挂。挂目录就能看到目录内文件的新旧替换。
      - /var/www/sqw.somtfly.com/deploy/nginx-conf:/etc/nginx/conf.d:ro
      # billion-context 面板的 basic auth 凭据
      - /etc/dsh-bili:/etc/nginx/dsh-bili:ro
    networks:
      - ai3000_net
    depends_on:
      - backend
      - upload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  ai3000_net:
    external: true
    name: ai3000_net

volumes:
  ai3000_mysql_data:
    external: true
    name: ai3000_mysql_data
  ai3000_rag_vector_db:
    external: true
    name: ai3000_rag_vector_db
  ai3000_nginx_certs:
    external: true
    name: ai3000_nginx_certs
  ai3000_model_cache:
    external: true
    name: ai3000_model_cache
  ai3000_upload_data:
    name: ai3000_upload_data
