<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>排盘结果 · 梅花易数</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/mhys_result.css?v=3">
</head>
<body>

<div class="mh-wrapper">
  <div class="mh-header">
    <a href="/mhys/" class="mh-back">← 返回排盘</a>
    <h1 class="mh-title">排盘结果</h1>
    <button class="ai-title-btn" id="aiBarBtn" onclick="toggleAIPanel()">☯ 看不懂？试试自动解析</button>
  </div>

  <div id="contentArea">
    <div class="load-state">
      <div class="spinner"></div>
      <p>加载中...</p>
    </div>
  </div>

  <!-- 解卦区（本卦/互卦/变卦…的解析）。**必须摆在正文容器的下一个兄弟位置**：
       AI 面板的宿主 `#aiInlineHost` 由引擎插在「正文容器 nextSibling」上
       （`ai_panel.js::aiInlineHost()`），所以顺序是
         排盘信息 → 起卦结果 → ☯ AI 解读 → 解卦区
       —— 用户 2026-09-25 要的就是「梅花的自动解析移到卦象解析前面」。
       ⚠ 别把解析区挪回 #contentArea 里面：那样宿主只能排到整个结果之后，
       AI 块又被压到最底下（这正是用户报的那个版面）。
       加载中是 hidden 的空框，`renderAnalysis()` 落内容时自己取消 hidden。 -->
  <div class="analysis-card" id="analysisArea" hidden></div>
</div>

<script src="/js/auth.js?v=1787305221"></script>
<script src="/js/ui_common.js?v=1"></script>
<script src="/js/hexagrams_data.js?v=1"></script>
<script src="/js/mhys_render.js?v=2"></script>
<script>
// ===== 加载数据 =====
async function load() {
  var area = document.getElementById('contentArea');
  var urlParams = new URLSearchParams(window.location.search);
  var id = urlParams.get('id');
  var isAdmin = urlParams.get('admin') === '1';

  if (id) {
    try {
      var token;
      if (isAdmin) {
        // 管理员查看：使用 admin token
        token = localStorage.getItem('sqw_admin_token');
      } else {
        token = AUTH.getToken();
      }
      var headers = token ? { 'Authorization':'Bearer '+token } : {};
      var resp = await fetch('/api/mhys-records/'+id, { headers:headers });
      if (!resp.ok) {
        area.innerHTML = '<div class="load-state"><p>排盘记录不存在或已删除</p></div>';
        return;
      }
      currentRecordId = id;
      var data = await resp.json();
      var result = typeof data.result_data === 'string' ? JSON.parse(data.result_data) : data.result_data;
      result.topic = data.topic;
      result.createdAt = data.created_at ? new Date(data.created_at) : null;
      currentResultMeta = {
        divinationTime: result.divinationTime || '',
        createdAt: result.createdAt ? (result.createdAt instanceof Date ? result.createdAt.toISOString() : result.createdAt) : (data.created_at || ''),
        method: result.method || ''
      };
      currentAiPayload = {
        numbers: result.numbers || '',
        lunarInfo: result.lunarInfo || {}
      };
      savedAnalysis = data.ai_analysis || '';
      area.innerHTML = renderResult(result);
      renderAnalysis();
      // 有保存的AI解读则在状态栏显示
      if (savedAnalysis) {
        var barBtn = document.getElementById('aiBarBtn');
        if (barBtn) barBtn.innerHTML = '<span class="ai-icon">☯</span><span>看不懂？试试自动解析</span>';
      }
    } catch(e) {
      area.innerHTML = '<div class="load-state"><p>加载失败，请重试</p></div>';
    }
  } else {
    var stored = localStorage.getItem('mhys_result') || sessionStorage.getItem('mhys_result');
    if (!stored) {
      area.innerHTML = '<div class="load-state"><p>没有排盘结果</p><a href="/mhys/" style="color:var(--accent);font-size:0.85rem;text-decoration:none;margin-top:0.5rem;display:inline-block">返回排盘</a></div>';
      return;
    }
    localStorage.removeItem('mhys_result');
    sessionStorage.removeItem('mhys_result');
    var result = JSON.parse(stored);
    currentResultMeta = {
      divinationTime: result.divinationTime || '',
      createdAt: result.createdAt || '',
      method: result.method || ''
    };
    currentAiPayload = {
      numbers: result.numbers || '',
      lunarInfo: result.lunarInfo || {}
    };
    area.innerHTML = renderResult(result);
    renderAnalysis();
  }
}

load();

// 等 load 渲染完成后更新 AI bar 状态
setTimeout(function checkBar() {
  var barBtn = document.getElementById('aiBarBtn');
  if (!barBtn) { setTimeout(checkBar, 100); return; }
  if (currentTopic) {
    barBtn.classList.remove('ai-disabled');
    barBtn.setAttribute('title', '点击打开AI解析');
  }
}, 200);
</script>

<!-- AI 面板引擎与梅花的配置（引擎与六爻页共用一份）。
     overlay 的点击关闭在引擎里绑，本页不再绑一次 —— 绑两处会关两次，
     看着一样，但那是两份 DOM 监听在各自为政。 -->
<script src="/js/ai_panel.js?v=4"></script>
<script src="/js/mhys_ai_panel.js?v=1"></script>

</body>
</html>
