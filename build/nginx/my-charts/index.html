     故 charts.css 必须放在**后面** —— 本页的灰阶文字才不会被面板那份顶成纯黑。 -->

<style>
:root {
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --shadow-card: 0 1px 4px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
}

.mc-page { max-width: 500px; margin: 0 auto; padding: 0 1rem 5rem; }

.mc-topbar { display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 0 0.6rem; }
.mc-topbar h1 { font-family:"Noto Serif SC",serif; font-size:1.15rem; font-weight:600; letter-spacing:0.08em; color:var(--text); }
.mc-topbar .mc-add-btn { display:inline-flex; align-items:center; justify-content:center; width:2.2rem; height:2.2rem; border:1px solid var(--border); border-radius:50%; font-size:1.2rem; color:var(--text-dim); text-decoration:none; transition:all 0.2s; line-height:1; }
.mc-topbar .mc-add-btn:hover { color:var(--text); border-color:var(--border-active); background:var(--bg-hover); }

/* ===== 列表卡片 ===== */
.mc-list { display:flex; flex-direction:column; gap:0.5rem; }

.mc-card { display:flex; align-items:center; padding:1rem 1.05rem; background:var(--bg-card); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:var(--radius-md); cursor:pointer; transition:all 0.25s; }
.mc-card:active { transform:scale(0.98); }

.mc-card .card-zodiac { width:2.6rem; height:2.6rem; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.5rem; flex-shrink:0; background:linear-gradient(135deg, rgba(184,150,10,0.12), transparent); margin-right:0.8rem; }

.mc-card .card-body { flex:1; min-width:0; }
.mc-card .card-name { font-size:0.92rem; font-weight:500; color:var(--text); letter-spacing:0.04em; margin-bottom:0.2rem; }
.mc-card .card-name { font-size:0.92rem; font-weight:500; color:var(--text); letter-spacing:0.04em; margin-bottom:0.15rem; }
.mc-card .card-info { font-size:0.78rem; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mc-card .card-arrow { font-size:1.2rem; color:var(--text-dim); cursor:pointer; padding:0.2rem; border-radius:50%; transition:all 0.2s; display:block; line-height:1; }
.mc-card .card-arrow:hover { background:rgba(0,0,0,0.04); }
/* 右侧元数据区 */
.mc-card .card-meta-right { display:flex; flex-direction:column; align-items:center; flex-shrink:0; margin-left:0.4rem; }
.mc-card .card-create-time { font-size:0.55rem; color:var(--text-dim); margin-top:2px; white-space:nowrap; opacity:0.7; }

/* ===== ⋯ 弹出菜单 ===== */
.card-menu-overlay { position:fixed; top:0; left:0; right:0; bottom:0; z-index:200; }
.card-menu-popup { position:absolute; z-index:201; background:#fff; border:1px solid #e8e3d8; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.1); min-width:130px; overflow:hidden; }
.card-menu-popup .menu-item { display:block; width:100%; padding:0.65rem 1rem; font-size:0.82rem; font-family:inherit; color:#333; background:none; border:none; text-align:left; cursor:pointer; transition:background 0.15s; letter-spacing:0.03em; }
.card-menu-popup .menu-item:hover { background:#f5f5f5; }
.card-menu-popup .menu-item.danger { color:#c94a4a; }
.card-menu-popup .menu-item + .menu-item { border-top:1px solid #e8e3d8; }

/* ===== 空状态 & Loading ===== */
.mc-empty { text-align:center; padding:4rem 1.5rem 2rem; }
.mc-empty .empty-icon { font-size:3rem; margin-bottom:0.6rem; opacity:0.3; }
.mc-empty .empty-title { font-family:"Noto Serif SC",serif; font-size:1rem; font-weight:500; color:var(--text); margin-bottom:0.3rem; }
.mc-empty .empty-desc { font-size:0.76rem; color:var(--text-dim); margin-bottom:1.4rem; line-height:1.5; }

@media (min-width:640px) { .mc-page { padding:0 0 5rem; } }

// ============================================================
// 列表
// ============================================================

async function loadList() {
  var charts;
  try { charts = await ChartsStore.getAll(); }
  catch(e) {
    renderEmpty(e&&e.status===401?'🔒':'⚠️', e&&e.status===401?'登录已过期':'加载失败', e&&e.status===401?'请重新登录后再查看':'请稍后重试或返回首页', e&&e.status===401?'/login/':'/', e&&e.status===401?'重新登录':'返回首页');
    return;
  }

  if (!charts||!charts.length) { renderEmpty('📜','还没有命盘','添加一份命盘，开始记录你的出生信息','/charts/?action=create','新建命盘'); return; }

  charts.forEach(function(c){
    var birthYear = c.birth.year;
    var zIdx = (birthYear - 4) % 12;
    if (zIdx < 0) zIdx += 12;
    var zodiacEmoji = ZODIAC_EMOJI[zIdx];
    var genderLabel = c.gender==='male'?'男':'女';
    var scIdx = Math.floor(((c.birth.hour ?? 12) + 1) % 24 / 2);
    var dateStr = birthYear+'.'+pad(c.birth.month)+'.'+pad(c.birth.day);
    var createStr = c.createdAt ? formatDate(c.createdAt) : '';

    if (c.bazi) {
      var bp = c.bazi.split(' ');
      if (bp.length >= 3) baziShort = bp[2]; // 日柱
    }

    h += '<div class="mc-card" id="card-'+c.id+'">';

    h += '<div class="card-body" onclick="location.href=\'/my-charts/?id='+c.id+'\'">';
    h += '<div class="card-name">'+esc(c.name)+'</div>';
    var infoLine = genderLabel+' '+dateStr+' '+SHICHEN[scIdx]+'时';
    h += '<div class="card-info">'+infoLine+'</div>';
    h += '</div>';
    h += '<div class="card-meta-right">';
    h += '<span class="card-arrow" onclick="event.stopPropagation();toggleMenu(\''+c.id+'\',\''+esc(c.name)+'\')">⋯</span>';
    if (createStr) h += '<span class="card-create-time">'+createStr+'</span>';
    h += '</div></div>';

  document.getElementById('mc-content').innerHTML = h;

// 详情
// ============================================================

async function loadDetail(id) {
  var chart;
  if (isAdminView) {
    // 管理员查看：调用 admin API
    try {
      var adminToken = localStorage.getItem('sqw_admin_token');
      var resp = await fetch('/api/admin/chart-detail/' + id, {
        headers: { 'Authorization': 'Bearer ' + adminToken }
      });
      if (resp.ok) chart = await resp.json();
    } catch(e) {}
  } else {
    try { chart = await ChartsStore.get(id); } catch(e) {}
  }
  if (!chart) {
    document.getElementById('mc-content').innerHTML =
      '<div class="mc-loading">命盘不存在或已删除</div><div style="text-align:center;margin-top:-4rem"><a href="/my-charts/" class="mc-empty empty-btn" style="display:inline-block;background:transparent;color:var(--accent);border:1px solid var(--accent)">← 返回列表</a></div>';
    return;
  }
  renderDetail(chart);
}

// ============================================================
// 详情：**盘由后端现算**，页面只发出生原始参数
// ============================================================
//
// 改法（2026-09-25）：从前这一页自己算四柱（下面那个 `calcBazi`），与
// `charts/index.html` 里的另一份、以及写库时的快照，同一件事三处实现 ——
// 而「两边各算一份、慢慢对不上」正是本项目最痛的病。现在页面**一个字都不算**：
// `POST /api/bazi/paipan` 走的是对拍过的 `paipan/`，而且**让 AI 读的那段 prompt
// 与页面上这张盘出自同一个函数**，不可能分叉。
//
// 拿回来的东西比从前多得多：主星/藏干/副星/纳音、旺衰、格局、用神、神煞、
// 刑冲合害、大运十步、流年、命局提要。版面交给 `js/bazi_render.js`，
// 解读交给 `js/bazi_ai_panel.js`（它挂在共用的 `js/ai_panel.js` 上）。

var GAN = '甲乙丙丁戊己庚辛壬癸';

function renderDetail(chart) {
  var b = chart.birth || {};
  var birthYear = b.year, birthMonth = b.month, birthDay = b.day;
  var birthHour = b.hour ?? 12;
  var birthMinute = b.minute ?? 0;
  var gender = chart.gender === 'male' ? '男' : '女';
  var isMale = chart.gender === 'male';

  var solarText = birthYear + '-' + pad(birthMonth) + '-' + pad(birthDay)
    + ' ' + pad(birthHour) + ':' + pad(birthMinute) + ':00';
  // 真太阳时：**这是显示用的一行字**，不参与排盘（后端那条端点也只收公历时刻）。
  // 全站这份算法目前还有两份副本（本页与 charts/index.html），下一步收进后端 display。
  var trueSolarStr = (chart.trueSolarTime && chart.longitude) ? trueSolarTextOf(chart) : '';

  var h = '';
  h += '<div class="detail-page">';
  h += isAdminView
    ? '<a href="/admin/" class="detail-back">← 返回后台</a>'
    : '<a href="/my-charts/" class="detail-back">← 返回列表</a>';
  h += '<div class="detail-hero">';
  h += '<div class="zodiac-frame" id="baziZodiac">' + zodiacEmojiOf(birthYear) + '</div>';
  h += '<div class="hero-name">' + esc(chart.name) + '</div>';
  h += '</div>';
  h += '<div id="baziChart"><div class="mc-loading" style="padding:2rem 1rem">正在排盘…</div></div>';
  // 解读区（管理员视图不给 —— 后台看的不是自己的盘，那条端点认的是用户 token）
  // ⚠ **顺序是用户点名要的**（2026-09-25，第一版做错了被骂过一次）：
  //   「先把 ai 解析块移到上面一些，让用户一眼就能看到（但可以选择折叠对话，所以不影响看
  //    下面的内容），除了排盘以外的不重要信息都给我放下面」。
  //   用户认的「排盘」= **生肖姓名 + 四柱八个字**（就 #baziChart 里那一段，别的都不是）。
  //   所以三块依次是：#baziChart（四柱）→ #baziAi（解读，标题那行可收起）
  //   → #baziRest（基本信息 + 四柱细盘 + 命局提要 + 大运）。
  //   ⚠ 手机上（390×844 实测）只要基本信息留在 AI 块上面，一屏就被它占满、AI 块只剩个标题。
  //   两块是**两次 innerHTML 写**（见 js/bazi_render.js 的 restHost），别合并回去。
  h += '<div id="baziAi"></div>';
  h += '<div id="baziRest"></div>';
  h += '<div class="detail-actions">';
  if (isAdminView) {
    h += '<a href="/admin/" class="btn">← 返回后台</a>';
  } else {
    h += '<a href="/charts/?action=edit&id=' + chart.id + '" class="btn">编辑此命盘</a>';
    h += '<button class="btn btn-danger" onclick="doDelete(\'' + chart.id + '\')">删除此命盘</button>';
  }
  h += '</div></div>';
  document.getElementById('mc-content').innerHTML = h;

  var birthReq = { y: birthYear, mo: birthMonth, d: birthDay,
    h: birthHour, mi: birthMinute, gender: chart.gender };
  var meta = {
    name: chart.name, genderText: gender, solarText: solarText,
    trueSolarText: trueSolarStr, birthplace: chart.birthplace,
    createdAt: chart.createdAt ? formatDateTime(chart.createdAt) : '',
  };

  fetch('/api/bazi/paipan', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(birthReq),
  }).then(function (r) {
    return r.json().then(function (j) { return { ok: r.ok, j: j }; });
  }).then(function (r) {
    if (!r.ok) throw new Error((r.j && r.j.error) || ('排盘失败（' + r.status + '）'));
    var resp = r.j;
    // 阳年/阴年、乾造/坤造：从**服务端的年干**取，不从 birthYear 推
    // （公历年推干支在「1月1日–立春」之间是错的）
    var yGan = (resp.chart && resp.chart.year_pillar && resp.chart.year_pillar.tiangan) || '';
    var gi = GAN.indexOf(yGan);
    if (gi >= 0) {
      meta.yinYang = (gi % 2 === 0) ? '阳' : '阴';
      meta.zao = isMale ? '乾造' : '坤造';
    }
    var zx = resp.display && resp.display.shengxiao;
    if (zx) {
      var zi = ZODIAC_NAMES.indexOf(zx);
      if (zi >= 0) document.getElementById('baziZodiac').textContent = ZODIAC_EMOJI[zi];
    }
    BaziRender.render(document.getElementById('baziChart'), resp, meta,
      document.getElementById('baziRest'));
    if (!isAdminView) {
      BaziAI.mount(document.getElementById('baziAi'), { chartId: chart.id, birth: birthReq });
    }
  }).catch(function (e) {
    renderDetailFallback(chart, meta, e);
  });
}

/**
 * 排盘取不到时的退路：信息表照给，四柱用**存库时的旧快照**（`chart.bazi`），
 * 并**明说**这份是旧的 —— 宁可说清，也别让用户拿一份来路不明的盘去对 AI 的解读。
 * 解读区不给（没有盘就没有可解读的东西）。
 */
function renderDetailFallback(chart, meta, err) {
  var el = document.getElementById('baziChart');
  if (!el) return;
  var h = '<div class="bz-sec" style="margin-top:0.4rem">';
  h += '<div class="detail-sheet">';
  h += '<div class="sheet-row"><span class="label">姓名：</span><span class="value">'
    + esc(chart.name) + ' ' + esc(meta.genderText) + '</span></div>';
  h += '<div class="sheet-row"><span class="label">公历：</span><span class="value">'
    + esc(meta.solarText) + '</span></div>';
  if (chart.bazi) {
    h += '<div class="sheet-row"><span class="label">四柱：</span><span class="value">'
      + esc(chart.bazi) + '</span></div>';
  }
  h += '</div>';
  h += '<div class="bz-note" style="border:none">⚠ 排盘没能取到（' + esc(err && err.message ? err.message : '网络不通')
    + '）。四柱若显示，是**存库时的旧快照**（按日粒度算的月柱，交节当天可能是错的）。'
    + '<br><a href="javascript:void(0)" onclick="location.reload()" style="color:#b8960a">重试</a></div>';
  h += '</div>';
  el.innerHTML = h;
  var ai = document.getElementById('baziAi');
  if (ai) ai.innerHTML = '';
  // 其余那块也要清空：退路是「这一次排盘没取到」，若留着上一次的细盘/大运，
  // 用户会把上一份盘的大运当成这一张的（切换命盘时最容易撞上）。
  var rest = document.getElementById('baziRest');
  if (rest) rest.innerHTML = '';
}

/** 生肖 emoji：本地表只用来挑图标，**不参与判断**（生肖本身由服务端给） */
function zodiacEmojiOf(birthYear) {
  var zIdx = (birthYear - 4) % 12;
  if (zIdx < 0) zIdx += 12;
  return ZODIAC_EMOJI[zIdx];
}

/**
 * 真太阳时（显示用）。算法与 `charts/index.html` 里那份同源，**还没合并** ——
 * 合并的方向是把它挪进后端 `/api/bazi/paipan` 的 `display`，改完删掉这两份。
 */
function trueSolarTextOf(chart) {
  var b = chart.birth || {};
  var y = b.year, mo = b.month, d = b.day;
  var hh = b.hour ?? 12, mi = b.minute ?? 0;
  try {
    var dayOfYear = Math.floor((new Date(y, mo - 1, d) - new Date(y, 0, 1)) / 86400000) + 1;
    var EoT = EOT_TABLE[dayOfYear - 1];
    if (EoT == null) return '';
    var adjMin = hh * 60 + mi + 4 * (Number(chart.longitude) - 120) + EoT;
    while (adjMin < 0) adjMin += 1440;
    while (adjMin >= 1440) adjMin -= 1440;
    var adjH = Math.floor(adjMin / 60);
    var adjMi = Math.round(adjMin % 60);
    if (adjMi === 60) { adjMi = 0; adjH = (adjH + 1) % 24; }
    return y + '-' + pad(mo) + '-' + pad(d) + ' ' + pad(adjH) + ':' + pad(adjMi) + ':00';
  } catch (e) { return ''; }
}

// ============================================================
// ⋯ 弹出菜单
// ============================================================

window.toggleMenu = function(chartId, chartName) {
  event.stopPropagation();
  var menu = document.getElementById('card-menu');
  if (menu && menu.dataset.chartId === chartId) { closeMenu(); return; }
  closeMenu();

  var btn = document.querySelector('#card-'+chartId+' .card-arrow');
  var rect = btn.getBoundingClientRect();

  var overlay = document.createElement('div');
  overlay.className = 'card-menu-overlay';
  overlay.onclick = closeMenu;

  var popup = document.createElement('div');
  popup.className = 'card-menu-popup';
  popup.id = 'card-menu';
  popup.dataset.chartId = chartId;
  popup.style.top = (rect.bottom + 4) + 'px';
  popup.style.right = (window.innerWidth - rect.right) + 'px';

  popup.innerHTML =
    '<button class="menu-item" onclick="closeMenu();location.href=\'/charts/?action=edit&id='+chartId+'\'">编辑命盘</button>' +
    '<button class="menu-item danger" onclick="closeMenu();doDelete(\''+chartId+'\')">🗑 删除命盘</button>';

  overlay.appendChild(popup);
  document.body.appendChild(overlay);
};

window.closeMenu = function() {
  var m = document.getElementById('card-menu');
  if (m) { var p = m.parentElement; if (p) p.remove(); }
};

// ============================================================
// 删除
// ============================================================

window.doDelete = async function(id) {
  if (!confirm('确定删除这个命盘吗？删除后不可恢复 (｡•́︿•̀｡)')) return;
  try { await ChartsStore.remove(id); window.location.href='/my-charts/'; }
  catch(e) { alert('删除失败: '+(e.message||'请稍后重试')); }
};

function renderEmpty(icon,title,desc,link,btnText) {
  var btn;
  if (link === '/login/') {
    btn = '<a href="javascript:void(0)" onclick="openAuthModal(\'login\')" class="empty-btn">'+btnText+'</a>';
  } else {
    btn = '<a href="'+link+'" class="empty-btn">'+btnText+'</a>';
  }
  document.getElementById('mc-content').innerHTML =
    '<div class="mc-empty"><div class="empty-icon">'+icon+'</div><p class="empty-title">'+title+'</p><p class="empty-desc">'+desc+'</p>'+btn+'</div>';
}

function esc(s) { var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function pad(n) { return String(n).padStart(2,'0'); }

function formatDate(s) {
  try { var d=new Date(s); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  catch(e) { return ''; }
}
function formatDateTime(s) {
  try { var d=new Date(s); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
  catch(e) { return ''; }
}
})();
